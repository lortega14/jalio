  <style>
    /* =========================================================
       JALIO · Tarjeta de contacto NFC
       Diseño premium, glassmorphism, dark theme
       ========================================================= */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --negro: #111111;
      --blanco: #ffffff;
      --papel: #f4f4f2;
      --gris: #707070;
      --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --ease: cubic-bezier(.2, .7, .2, 1);
    }

    html {
      -webkit-text-size-adjust: 100%;
      background: var(--negro);
    }

    body {
      font-family: var(--font);
      color: var(--blanco);
      background: var(--negro);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
      padding: 24px 16px;
    }

    ::selection { background: var(--blanco); color: var(--negro); }

    /* ---------- Background animation ---------- */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .bg__orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.12;
      animation: float 20s ease-in-out infinite alternate;
    }

    .bg__orb--1 {
      width: 400px;
      height: 400px;
      background: #4a9eff;
      top: -120px;
      right: -80px;
      animation-duration: 18s;
    }

    .bg__orb--2 {
      width: 350px;
      height: 350px;
      background: #a855f7;
      bottom: -100px;
      left: -60px;
      animation-delay: -6s;
      animation-duration: 22s;
    }

    .bg__orb--3 {
      width: 250px;
      height: 250px;
      background: #22d3ee;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation-delay: -10s;
      animation-duration: 25s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -20px) scale(1.05); }
      66% { transform: translate(-20px, 15px) scale(0.95); }
      100% { transform: translate(10px, -10px) scale(1.02); }
    }

    /* ---------- Card ---------- */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 40px 32px 32px;
      text-align: center;
      animation: cardIn 0.8s var(--ease) both;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.96);
      }
    }

    /* ---------- Logo ---------- */
    .card__logo {
      width: 80px;
      height: auto;
      margin: 0 auto 28px;
      color: var(--blanco);
      opacity: 0.9;
      animation: fadeUp 0.6s var(--ease) 0.2s both;
    }

    /* ---------- Avatar placeholder ---------- */
    .card__avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, #4a9eff 0%, #a855f7 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 700;
      color: var(--blanco);
      letter-spacing: -0.02em;
      box-shadow: 0 8px 32px rgba(74, 158, 255, 0.2);
      animation: fadeUp 0.6s var(--ease) 0.3s both;
    }

    /* ---------- Info ---------- */
    .card__name {
      font-size: 1.625rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 4px;
      animation: fadeUp 0.6s var(--ease) 0.35s both;
    }

    .card__role {
      font-size: 0.9375rem;
      color: rgba(255, 255, 255, 0.55);
      font-weight: 500;
      margin-bottom: 6px;
      animation: fadeUp 0.6s var(--ease) 0.4s both;
    }

    .card__company {
      font-size: 0.8125rem;
      color: rgba(255, 255, 255, 0.35);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 32px;
      animation: fadeUp 0.6s var(--ease) 0.45s both;
    }

    /* ---------- Divider ---------- */
    .card__divider {
      border: none;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
      margin-bottom: 28px;
      animation: fadeUp 0.6s var(--ease) 0.5s both;
    }

    /* ---------- Links ---------- */
    .card__links {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 28px;
      animation: fadeUp 0.6s var(--ease) 0.55s both;
    }

    .card__link {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      text-decoration: none;
      color: var(--blanco);
      font-size: 0.9375rem;
      font-weight: 500;
      transition: all 0.3s var(--ease);
    }

    .card__link:hover,
    .card__link:focus-visible {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(255, 255, 255, 0.14);
      transform: translateY(-1px);
    }

    .card__link:active {
      transform: scale(0.98);
    }

    .card__link-icon {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      opacity: 0.7;
    }

    .card__link-label {
      flex: 1;
      text-align: left;
    }

    .card__link-label small {
      display: block;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.4);
      font-weight: 400;
      margin-top: 1px;
    }

    .card__link-arrow {
      width: 16px;
      height: 16px;
      opacity: 0.3;
      transition: opacity 0.3s, transform 0.3s;
    }

    .card__link:hover .card__link-arrow {
      opacity: 0.6;
      transform: translateX(2px);
    }

    /* ---------- Save button ---------- */
    .card__save {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px 24px;
      border: none;
      border-radius: 14px;
      background: var(--blanco);
      color: var(--negro);
      font-family: var(--font);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s var(--ease);
      animation: fadeUp 0.6s var(--ease) 0.65s both;
    }

    .card__save:hover {
      background: var(--papel);
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(255, 255, 255, 0.1);
    }

    .card__save:active {
      transform: scale(0.97);
    }

    .card__save-icon {
      width: 20px;
      height: 20px;
    }

    /* ---------- NFC hint ---------- */
    .card__nfc {
      margin-top: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.25);
      animation: fadeUp 0.6s var(--ease) 0.75s both;
    }

    .card__nfc svg {
      width: 14px;
      height: 14px;
      opacity: 0.4;
    }

    /* ---------- Success toast ---------- */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(34, 211, 154, 0.15);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(34, 211, 154, 0.25);
      color: #22d39a;
      padding: 12px 24px;
      border-radius: 12px;
      font-family: var(--font);
      font-size: 0.875rem;
      font-weight: 500;
      z-index: 100;
      pointer-events: none;
      opacity: 0;
      transition: all 0.4s var(--ease);
    }

    .toast.is-visible {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* ---------- Animations ---------- */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
    }

    /* ---------- Focus ---------- */
    :focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.5);
      outline-offset: 3px;
      border-radius: 4px;
    }

    /* ---------- Responsive ---------- */
    @media (max-width: 420px) {
      .card {
        padding: 32px 24px 24px;
        border-radius: 20px;
      }

      .card__avatar {
        width: 72px;
        height: 72px;
        font-size: 1.625rem;
      }

      .card__name {
        font-size: 1.375rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-delay: 0ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
