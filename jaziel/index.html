  <style>
    /* =========================================================
       JALIO · Tarjeta de contacto NFC
       Basado en Brand Guidelines v1.0 & Kit Canva
       Paleta: Negro Jalio (#111111), Blanco (#FFFFFF), Papel (#F4F4F2), Gris (#707070)
       Acento: Verde lima (#C4F53B) — Regla 90% neutros, 10% acento
       Tipografía: Inter (comunicar) + JetBrains Mono (técnico)
       ========================================================= */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --negro: #111111;
      --blanco: #ffffff;
      --papel: #f4f4f2;
      --gris: #707070;
      --bg: #111111;
      --surface: #161616;
      --surface-2: #1c1c1c;
      --surface-hover: #222222;
      --fg: #f4f4f2;
      --fg-2: #b8b8b6;
      --fg-3: #8e8e8c;
      --line: #262626;
      --line-2: #363636;
      --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
      --r-sm: 8px;
      --r-md: 12px;
      --r-lg: 16px;
      --ease: cubic-bezier(.2, .7, .2, 1);
      --particle: 255, 255, 255;
      --accent: #FF6B2C;
    }

    html {
      -webkit-text-size-adjust: 100%;
      background: var(--bg);
    }

    body {
      font-family: var(--font);
      color: var(--fg);
      background: var(--bg);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      padding: clamp(20px, 4vw, 40px) 16px;
      position: relative;
      overflow-x: hidden;
    }

    ::selection {
      background: var(--blanco);
      color: var(--negro);
    }

    /* ---------- Partículas de fondo (del sitio oficial Jalio) ---------- */
    .bg-particles {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      opacity: 0.6;
    }

    .bg-vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(circle at 50% 50%, rgba(17, 17, 17, 0.3) 0%, rgba(17, 17, 17, 0.85) 100%);
    }

    /* ---------- Tarjeta Principal ---------- */
    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 410px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      padding: 36px 28px 28px;
      box-shadow: 0 32px 80px -24px rgba(0, 0, 0, 0.95);
      animation: cardIn 0.8s var(--ease) both;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* ---------- Cabecera de marca ---------- */
    .card__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--line);
    }

    .card__brand {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      color: var(--blanco);
      transition: opacity 0.2s var(--ease);
    }

    .card__brand:hover {
      opacity: 0.8;
    }

    .card__logo {
      width: 112px;
      height: auto;
      aspect-ratio: 476 / 132.21;
    }

    .card__tag {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.04em;
      color: var(--fg-3);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .card__status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }

    /* ---------- Perfil / Identidad ---------- */
    .card__profile {
      display: flex;
      align-items: flex-start;
      gap: 18px;
      margin-bottom: 26px;
      text-align: left;
    }

    .card__avatar {
      flex-shrink: 0;
      width: 64px;
      height: 64px;
      border-radius: var(--r-md);
      background: var(--surface-2);
      border: 1px solid var(--line-2);
      display: grid;
      place-items: center;
      color: var(--blanco);
      padding: 12px;
      position: relative;
    }

    .card__avatar svg {
      width: 100%;
      height: 100%;
      fill: currentColor;
    }

    .card__identity {
      flex: 1;
      min-width: 0;
    }

    .card__name {
      font-size: 1.4375rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1.2;
      color: var(--blanco);
      margin-bottom: 4px;
    }

    .card__role {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--fg-2);
      line-height: 1.35;
      margin-bottom: 6px;
    }

    .card__meta {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.02em;
      color: var(--fg-3);
      display: block;
    }

    /* ---------- Lista de Enlaces ---------- */
    .card__links {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 22px;
    }

    .card__link {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      text-decoration: none;
      color: var(--fg);
      transition: background-color 0.25s var(--ease), border-color 0.25s var(--ease), transform 0.25s var(--ease);
    }

    .card__link:hover,
    .card__link:focus-visible {
      background: var(--surface-hover);
      border-color: var(--line-2);
      transform: translateY(-1px);
    }

    .card__link:active {
      transform: translateY(1px) scale(0.99);
    }

    .card__link-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      color: var(--fg-2);
      transition: color 0.2s var(--ease);
    }

    .card__link:hover .card__link-icon {
      color: var(--blanco);
    }

    .card__link-text {
      flex: 1;
      text-align: left;
      min-width: 0;
    }

    .card__link-title {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--blanco);
      line-height: 1.2;
    }

    .card__link-desc {
      display: block;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--fg-3);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card__link-arrow {
      width: 14px;
      height: 14px;
      color: var(--fg-3);
      transition: transform 0.25s var(--ease), color 0.25s var(--ease);
    }

    .card__link:hover .card__link-arrow {
      color: var(--blanco);
      transform: translateX(2px);
    }

    /* ---------- Botón Guardar Contacto (Jalio .btn--light) ---------- */
    .card__save {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 50px;
      padding: 0 20px;
      border: 1px solid transparent;
      border-radius: var(--r-md);
      background: var(--blanco);
      color: var(--negro);
      font-family: var(--font);
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.25s var(--ease), transform 0.25s var(--ease);
    }

    .card__save:hover,
    .card__save:focus-visible {
      background: #e6e6e3;
      transform: translateY(-1px);
    }

    .card__save:active {
      transform: translateY(1px) scale(0.99);
    }

    .card__save-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    /* ---------- Pie técnico ---------- */
    .card__footer {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--fg-3);
    }

    .card__footer a {
      color: inherit;
      text-decoration: none;
      transition: color 0.2s var(--ease);
    }

    .card__footer a:hover {
      color: var(--blanco);
    }

    /* ---------- Toast ---------- */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--surface-2);
      border: 1px solid var(--line-2);
      color: var(--blanco);
      padding: 10px 20px;
      border-radius: var(--r-sm);
      font-family: var(--mono);
      font-size: 12px;
      z-index: 100;
      pointer-events: none;
      opacity: 0;
      transition: all 0.35s var(--ease);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast.is-visible {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* ---------- Responsive ---------- */
    @media (max-width: 440px) {
      .card {
        padding: 28px 20px 22px;
        border-radius: var(--r-md);
      }

      .card__name {
        font-size: 1.25rem;
      }

      .card__avatar {
        width: 56px;
        height: 56px;
        padding: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-delay: 0ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
